services:
  mysql:
    image: mysql:8.0
    container_name: mon-portfolio-db
    restart: always
    environment:
      MYSQL_DATABASE: mon_portfolio
      MYSQL_USER: portfolio_user
      MYSQL_PASSWORD: portfolio_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
